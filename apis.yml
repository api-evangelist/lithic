aid: lithic
url: https://raw.githubusercontent.com/api-evangelist/lithic/refs/heads/main/apis.yml
name: Lithic
kind: company
description: Lithic is a modern card-issuing and program-management platform offering
  REST APIs for cards, accounts, transactions, authorization control, ACH/wire payments,
  external bank accounts, account-holder KYC/KYB, 3-D Secure, tokenization, disputes,
  and webhooks. OpenAPI spec is published via Stainless and powers official SDKs in
  Node, Python, Go, Java, Kotlin.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
- FinTech
- BaaS
- Card Issuing
- Payments
- Embedded Finance
