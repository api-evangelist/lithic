  - type: mcp
    namespace: lithic-card-mcp
    port: 9090
    transport: http
    description: MCP adapter for Lithic Developer API — Card. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-card-programs
      description: List card programs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lithic-card.getcardprograms
      outputParameters:
      - type: object
        mapping: $.
    - name: get-card-program
      description: Get card program
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lithic-card.getcardprogram
      outputParameters:
      - type: object
        mapping: $.
    - name: list-cards
      description: List cards
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lithic-card.getcards
      with:
        account_token: tools.account_token
        state: tools.state
        memo: tools.memo
      outputParameters:
      - type: object
        mapping: $.
    - name: create-card
      description: Create card
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: lithic-card.postcards
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: search-card-pan
