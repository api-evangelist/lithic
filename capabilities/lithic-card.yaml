      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: lithic-card.searchcardbypan
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-card
      description: Get card
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lithic-card.getcardbytoken
      outputParameters:
      - type: object
        mapping: $.
    - name: update-card
