naftiko: 1.0.0-alpha2
info:
  label: Lithic Developer API — Responder Endpoints
  description: 'Lithic Developer API — Responder Endpoints. 3 operations. Lead operation: Disenroll a responder endpoint.
    Self-contained Naftiko capability covering one Lithic business surface.'
  tags:
  - Lithic
  - Responder Endpoints
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LITHIC_API_KEY: LITHIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: lithic-responder-endpoints
    baseUri: https://sandbox.lithic.com
    description: Lithic Developer API — Responder Endpoints business capability. Self-contained, no shared references.
    resources:
    - name: v1-responder_endpoints
      path: /v1/responder_endpoints
      operations:
      - name: deleteresponderendpoint
        method: DELETE
        description: Disenroll a responder endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: The type of the endpoint.
          required: true
      - name: getresponderendpoints
        method: GET
        description: Check the status of a responder endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: The type of the endpoint.
          required: true
      - name: postresponderendpoints
        method: POST
        description: Enroll a responder endpoint
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.LITHIC_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: lithic-responder-endpoints-rest
    port: 8080
    description: REST adapter for Lithic Developer API — Responder Endpoints. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v1/responder-endpoints
      name: v1-responder-endpoints
      description: REST surface for v1-responder_endpoints.
      operations:
      - method: DELETE
        name: deleteresponderendpoint
        description: Disenroll a responder endpoint
        call: lithic-responder-endpoints.deleteresponderendpoint
        with:
          type: rest.type
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: getresponderendpoints
        description: Check the status of a responder endpoint
        call: lithic-responder-endpoints.getresponderendpoints
        with:
          type: rest.type
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: postresponderendpoints
        description: Enroll a responder endpoint
        call: lithic-responder-endpoints.postresponderendpoints
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: lithic-responder-endpoints-mcp
    port: 9090
    transport: http
    description: MCP adapter for Lithic Developer API — Responder Endpoints. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: disenroll-responder-endpoint
      description: Disenroll a responder endpoint
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: lithic-responder-endpoints.deleteresponderendpoint
      with:
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
    - name: check-status-responder-endpoint
      description: Check the status of a responder endpoint
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lithic-responder-endpoints.getresponderendpoints
      with:
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
    - name: enroll-responder-endpoint
      description: Enroll a responder endpoint
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: lithic-responder-endpoints.postresponderendpoints
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
