naftiko: 1.0.0-alpha2
info:
  label: Lithic Developer API — Statements
  description: 'Lithic Developer API — Statements. 11 operations. Lead operation: List interest tier schedules. Self-contained
    Naftiko capability covering one Lithic business surface.'
  tags:
  - Lithic
  - Statements
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LITHIC_API_KEY: LITHIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: lithic-statements
    baseUri: https://sandbox.lithic.com
    description: Lithic Developer API — Statements business capability. Self-contained, no shared references.
    resources:
    - name: v1-financial_accounts-financial_account_token-interest_tier_schedule
      path: /v1/financial_accounts/{financial_account_token}/interest_tier_schedule
      operations:
      - name: listinteresttierschedules
        method: GET
        description: List interest tier schedules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: after_date
          in: query
          type: string
          description: Return schedules with effective_date >= after_date (ISO format YYYY-MM-DD)
        - name: before_date
          in: query
          type: string
          description: Return schedules with effective_date <= before_date (ISO format YYYY-MM-DD)
        - name: financial_account_token
          in: path
          type: string
          description: Globally unique identifier for financial account
          required: true
        - name: for_date
          in: query
          type: string
          description: Return schedule with effective_date == for_date (ISO format YYYY-MM-DD)
      - name: createinteresttierschedule
        method: POST
        description: Create interest tier schedule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: financial_account_token
          in: path
          type: string
          description: Globally unique identifier for financial account
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-financial_accounts-financial_account_token-interest_tier_schedule-effective_d
      path: /v1/financial_accounts/{financial_account_token}/interest_tier_schedule/{effective_date}
      operations:
      - name: deleteinteresttierschedule
        method: DELETE
        description: Delete interest tier schedule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: effective_date
          in: path
          type: string
          description: Effective date in ISO format (YYYY-MM-DD)
          required: true
        - name: financial_account_token
          in: path
          type: string
          description: Globally unique identifier for financial account
          required: true
      - name: getinteresttierschedule
        method: GET
        description: Get interest tier schedule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: effective_date
          in: path
          type: string
          description: Effective date in ISO format (YYYY-MM-DD)
          required: true
        - name: financial_account_token
          in: path
          type: string
          description: Globally unique identifier for financial account
          required: true
      - name: updateinteresttierschedule
        method: PUT
        description: Update interest tier schedule
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: effective_date
          in: path
          type: string
          description: Effective date in ISO format (YYYY-MM-DD)
          required: true
        - name: financial_account_token
          in: path
          type: string
          description: Globally unique identifier for financial account
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-financial_accounts-financial_account_token-loan_tape_configuration
      path: /v1/financial_accounts/{financial_account_token}/loan_tape_configuration
      operations:
      - name: getloantapeconfiguration
        method: GET
        description: Get loan tape configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: financial_account_token
          in: path
          type: string
          description: Globally unique identifier for financial account.
          required: true
    - name: v1-financial_accounts-financial_account_token-loan_tapes
      path: /v1/financial_accounts/{financial_account_token}/loan_tapes
      operations:
      - name: getloantapes
        method: GET
        description: List loan tapes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: begin
          in: query
          type: string
          description: Date string in RFC 3339 format. Only entries created after the specified date will be included.
        - name: end
          in: query
          type: string
          description: Date string in RFC 3339 format. Only entries created before the specified date will be included.
        - name: ending_before
          in: query
          type: string
          description: A cursor representing an item's token before which a page of results should end. Used to retrieve the
            previous page of results before this item.
        - name: financial_account_token
          in: path
          type: string
          description: Globally unique identifier for financial account.
          required: true
        - name: page_size
          in: query
          type: integer
          description: Page size (for pagination).
        - name: starting_after
          in: query
          type: string
          description: A cursor representing an item's token after which a page of results should begin. Used to retrieve
            the next page of results after this item.
    - name: v1-financial_accounts-financial_account_token-loan_tapes-loan_tape_token
      path: /v1/financial_accounts/{financial_account_token}/loan_tapes/{loan_tape_token}
      operations:
      - name: getloantape
        method: GET
        description: Get loan tape by token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: financial_account_token
          in: path
          type: string
          description: Globally unique identifier for financial account.
          required: true
        - name: loan_tape_token
          in: path
          type: string
          description: Globally unique identifier for loan tape.
          required: true
    - name: v1-financial_accounts-financial_account_token-statements
      path: /v1/financial_accounts/{financial_account_token}/statements
      operations:
      - name: getstatements
        method: GET
        description: List statements
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: begin
          in: query
          type: string
          description: Date string in RFC 3339 format. Only entries created after the specified date will be included.
        - name: end
          in: query
          type: string
          description: Date string in RFC 3339 format. Only entries created before the specified date will be included.
        - name: ending_before
          in: query
          type: string
          description: A cursor representing an item's token before which a page of results should end. Used to retrieve the
            previous page of results before this item.
        - name: financial_account_token
          in: path
          type: string
          description: Globally unique identifier for financial account.
          required: true
        - name: page_size
          in: query
          type: integer
          description: Page size (for pagination).
        - name: starting_after
          in: query
          type: string
          description: A cursor representing an item's token after which a page of results should begin. Used to retrieve
            the next page of results after this item.
        - name: include_initial_statements
          in: query
          type: boolean
          description: Whether to include the initial statement. It is not included by default.
    - name: v1-financial_accounts-financial_account_token-statements-statement_token
      path: /v1/financial_accounts/{financial_account_token}/statements/{statement_token}
      operations:
      - name: getstatement
        method: GET
        description: Get statement by token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: financial_account_token
          in: path
          type: string
          description: Globally unique identifier for financial account.
          required: true
        - name: statement_token
          in: path
          type: string
          description: Globally unique identifier for statements.
          required: true
    - name: v1-financial_accounts-financial_account_token-statements-statement_token-line_it
      path: /v1/financial_accounts/{financial_account_token}/statements/{statement_token}/line_items
      operations:
      - name: getstatementlineitems
        method: GET
        description: List line items for a statement
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ending_before
          in: query
          type: string
          description: A cursor representing an item's token before which a page of results should end. Used to retrieve the
            previous page of results before this item.
        - name: financial_account_token
          in: path
          type: string
          description: Globally unique identifier for financial account.
          required: true
        - name: page_size
          in: query
          type: integer
          description: Page size (for pagination).
        - name: starting_after
          in: query
          type: string
          description: A cursor representing an item's token after which a page of results should begin. Used to retrieve
            the next page of results after this item.
        - name: statement_token
          in: path
          type: string
          description: Globally unique identifier for statements.
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.LITHIC_API_KEY}}'
      placement: header
