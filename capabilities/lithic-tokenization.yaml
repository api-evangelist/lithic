        readOnly: false
        destructive: false
        idempotent: false
      call: lithic-tokenization.unpausetokenization
      with:
        tokenization_token: tools.tokenization_token
      outputParameters:
      - type: object
        mapping: $.
    - name: update-digital-card-art-card
