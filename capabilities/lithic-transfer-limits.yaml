naftiko: 1.0.0-alpha2
info:
  label: Lithic Developer API — Transfer Limits
  description: 'Lithic Developer API — Transfer Limits. 1 operations. Lead operation: Get transfer limits. Self-contained
    Naftiko capability covering one Lithic business surface.'
  tags:
  - Lithic
  - Transfer Limits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LITHIC_API_KEY: LITHIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: lithic-transfer-limits
    baseUri: https://sandbox.lithic.com
    description: Lithic Developer API — Transfer Limits business capability. Self-contained, no shared references.
    resources:
    - name: v1-transfer_limits
      path: /v1/transfer_limits
      operations:
      - name: gettransferlimits
        method: GET
        description: Get transfer limits
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: date
          in: query
          type: string
          description: Date for which to retrieve transfer limits (ISO 8601 format)
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.LITHIC_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: lithic-transfer-limits-rest
    port: 8080
    description: REST adapter for Lithic Developer API — Transfer Limits. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/transfer-limits
      name: v1-transfer-limits
      description: REST surface for v1-transfer_limits.
      operations:
      - method: GET
        name: gettransferlimits
        description: Get transfer limits
        call: lithic-transfer-limits.gettransferlimits
        with:
          date: rest.date
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: lithic-transfer-limits-mcp
    port: 9090
    transport: http
    description: MCP adapter for Lithic Developer API — Transfer Limits. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-transfer-limits
      description: Get transfer limits
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lithic-transfer-limits.gettransferlimits
      with:
        date: tools.date
      outputParameters:
      - type: object
        mapping: $.
