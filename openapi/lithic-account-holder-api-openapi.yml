      summary: Get an individual or business account holder
      tags:
      - Account Holder
    patch:
      description: 'Update the information associated with a particular account holder (including business owners and control persons associated to a business account).

        If Lithic is performing KYB or KYC and additional verification is required we will run the individual''s or business''s updated information again and return whether the status is accepted or pending (i.e., further action required).

        All calls to this endpoint will return a synchronous response. The response time will depend on the workflow. In some cases, the response may indicate the workflow is under review or further action will be needed to complete the account creation process.

        This endpoint can only be used on existing accounts that are part of the program that the calling API key manages.'
      operationId: patchAccountHolder
      parameters:
      - $ref: '#/components/parameters/accountHolderToken'
      requestBody:
        content:
          application/json:
            examples:
              kybRequest:
                summary: Update a business account holder with KYB workflow
                value:
                  business_entity:
                    entity_token: 83cf25ae-c14f-4d10-9fa2-0119f36c7286
                    address:
                      postal_code: '61023'
                  control_person:
                    entity_token: fd771a07-c5c2-42f3-a53c-a6c79c6c0d07
                    address:
                      postal_code: '68023'
                  naics_code: '541512'
                  website_url: https://www.mynewbusiness.com
              kycExemptRequest:
                summary: Update an individual account holder with KYC workflow
                value:
                  individual:
                    entity_token: fd771a07-c5c2-42f3-a53c-a6c79c6c0d07
                    address:
                      postal_code: '68023'
                    phone_number: '+15555555555'
              kycRequest:
                summary: Update an individual account holder with KYC workflow
                value:
                  individual:
                    entity_token: fd771a07-c5c2-42f3-a53c-a6c79c6c0d07
                    address:
                      postal_code: '68023'
                    government_id: 111-23-1413
            schema:
              anyOf:
              - $ref: '#/components/schemas/kyb-patch-request'
              - $ref: '#/components/schemas/kyc-patch-request'
              - $ref: '#/components/schemas/patch-request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/kyb-kyc-patch-response'
                - $ref: '#/components/schemas/patch-response'
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'
      summary: Update account holder information and possibly resubmit for evaluation
      tags:
      - Account Holder
  /v1/account_holders/{account_holder_token}/documents:
    get:
      description: 'Retrieve the status of account holder document uploads, or retrieve the upload URLs to process your image uploads.


        Note that this is not equivalent to checking the status of the KYC evaluation overall (a document may be successfully uploaded but not be sufficient for KYC to pass).


        In the event your upload URLs have expired, calling this endpoint will refresh them.

        Similarly, in the event a previous account holder document upload has failed, you can use this endpoint to get a new upload URL for the failed image upload.


        When a new document upload is generated for a failed attempt, the response will show an additional entry in the `required_document_uploads` list

        in a `PENDING` state for the corresponding `image_type`.

        '
      operationId: getAccountHolderDocuments
      parameters:
      - $ref: '#/components/parameters/accountHolderTokenPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/document'
                    type: array
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Get account holder document uploads
      tags:
      - Account Holder
    post:
      description: 'Use this endpoint to identify which type of supported government-issued documentation you will upload for further verification.

        It will return two URLs to upload your document images to - one for the front image and one for the back image.


        This endpoint is only valid for evaluations in a `PENDING_DOCUMENT` state.


        Supported file types include `jpg`, `png`, and `pdf`. Each file must be less than 15 MiB. Once both required uploads have been successfully completed, your document will be run through KYC verification.


        If you have registered a webhook, you will receive evaluation updates for any document submission evaluations, as well as for any failed document uploads.


        Two document submission attempts are permitted via this endpoint before a `REJECTED` status is returned and the account creation process is ended. Currently only one type of

        account holder document is supported per KYC verification.

        '
      operationId: postAccountHolderDocuments
      parameters:
      - $ref: '#/components/parameters/accountHolderTokenPath'
      requestBody:
        content:
          application/json:
            examples:
              recieveLinkForDriversLicense:
                summary: Initiate account holder document upload
                value:
                  entity_token: 83cf25ae-c14f-4d10-9fa2-0119f36c7286
                  document_type: EIN_LETTER
            schema:
              properties:
                document_type:
                  description: The type of document to upload
                  enum:
                  - EIN_LETTER
                  - TAX_RETURN
                  - OPERATING_AGREEMENT
                  - CERTIFICATE_OF_FORMATION
                  - DRIVERS_LICENSE
                  - PASSPORT
                  - PASSPORT_CARD
                  - CERTIFICATE_OF_GOOD_STANDING
                  - ARTICLES_OF_INCORPORATION
                  - ARTICLES_OF_ORGANIZATION
                  - BYLAWS
                  - GOVERNMENT_BUSINESS_LICENSE
                  - PARTNERSHIP_AGREEMENT
                  - SS4_FORM
                  - BANK_STATEMENT
                  - UTILITY_BILL_STATEMENT
                  - SSN_CARD
                  - ITIN_LETTER
                  - FINCEN_BOI_REPORT
                  type: string
                entity_token:
                  description: Globally unique identifier for the entity.
                  type: string
                  format: uuid
              required:
              - document_type
              - entity_token
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/document'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Initiate account holder document upload
      tags:
      - Account Holder
  /v1/account_holders/{account_holder_token}/documents/{document_token}:
    get:
      description: 'Check the status of an account holder document upload, or retrieve the upload URLs to process your image uploads.


        Note that this is not equivalent to checking the status of the KYC evaluation overall (a document may be successfully uploaded but not be sufficient for KYC to pass).


        In the event your upload URLs have expired, calling this endpoint will refresh them.

        Similarly, in the event a document upload has failed, you can use this endpoint to get a new upload URL for the failed image upload.


        When a new account holder document upload is generated for a failed attempt, the response will show an additional entry in the `required_document_uploads` array

        in a `PENDING` state for the corresponding `image_type`.

        '
      operationId: getAccountHolderDocumentByToken
      parameters:
      - $ref: '#/components/parameters/accountHolderTokenPath'
      - $ref: '#/components/parameters/documentToken'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/document'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Get account holder document upload status
      tags:
      - Account Holder
  /v1/account_holders/{account_holder_token}/entities:
    post:
      description: 'Create a new beneficial owner individual or replace the control person entity on an existing KYB account holder. This endpoint is only applicable for account holders enrolled through a KYB workflow with the Persona KYB provider.

        A new control person can only replace the existing one. A maximum of 4 beneficial owners can be associated with an account holder.'
      operationId: postAccountHolderEntities
      parameters:
      - $ref: '#/components/parameters/accountHolderTokenPath'
      requestBody:
        content:
          application/json:
            examples:
              createBeneficialOwner:
                summary: Create a new beneficial owner individual
                value:
                  type: BENEFICIAL_OWNER_INDIVIDUAL
                  first_name: Timmy
                  last_name: Turner
                  dob: '1991-03-08T08:00:00Z'
                  email: tim@left-earth.com
                  phone_number: '+15555555555'
                  government_id: 211-23-1412
                  address:
                    address1: 300 Normal Forest Way
                    city: Portland
                    country: USA
                    postal_code: '90210'
                    state: OR
              replaceControlPerson:
                summary: Replace the existing control person entity
                value:
                  type: CONTROL_PERSON
                  first_name: Tom
                  last_name: Timothy
                  dob: '1991-03-08T08:00:00Z'
                  email: tom@middle-pluto.com
                  phone_number: '+15555555555'
                  government_id: 111-23-1412
                  address:
                    address1: 451 New Forest Way
                    city: Springfield
                    country: USA
                    postal_code: '68022'
                    state: IL
            schema:
              $ref: '#/components/schemas/create-entity-request'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                acceptedResponse:
                  summary: Accepted entity creation response
                  value:
                    account_holder_token: fa68ed76-9d02-4d45-8a3f-782f3b6a8b3f
                    status: ACCEPTED
                    status_reasons: []
                    token: 49c978db-20c4-46d8-9db4-b0ef28c03533
                    created: '2024-09-16T20:13:41.865274'
                    required_documents: []
                pendingReviewResponse:
                  summary: Pending review entity creation response
                  value:
                    account_holder_token: fa68ed76-9d02-4d45-8a3f-782f3b6a8b3f
                    status: PENDING_REVIEW
                    status_reasons:
                    - NAME_VERIFICATION_FAILURE
                    token: 49c978db-20c4-46d8-9db4-b0ef28c03533
                    created: '2024-09-16T20:13:41.865274'
                    required_documents: []
              schema:
                $ref: '#/components/schemas/create-entity-response'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Create a new beneficial owner individual or replace the existing control person entity
      tags:
      - Account Holder
  /v1/account_holders/{account_holder_token}/entities/{entity_token}:
    delete:
      description: Deactivate a beneficial owner individual on an existing KYB account holder. Only beneficial owner individuals can be deactivated.
      operationId: deleteAccountHolderEntity
      parameters:
      - $ref: '#/components/parameters/accountHolderTokenPath'
      - $ref: '#/components/parameters/entityTokenPath'
      responses:
        '200':
          content:
            application/json:
              examples:
                deactivatedEntityResponse:
                  summary: Deactivated beneficial owner individual
                  value:
                    account_holder_token: fa68ed76-9d02-4d45-8a3f-782f3b6a8b3f
                    token: 49c978db-20c4-46d8-9db4-b0ef28c03533
                    type: BENEFICIAL_OWNER_INDIVIDUAL
                    status: INACTIVE
                    first_name: Timmy
                    last_name: Turner
                    email: tim@left-earth.com
                    phone_number: '+15555555555'
                    dob: '1991-03-08T08:00:00Z'
                    address:
                      address1: 300 Normal Forest Way
                      city: Portland
                      country: USA
                      postal_code: '90210'
                      state: OR
              schema:
                $ref: '#/components/schemas/entity-response'
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Deactivate a beneficial owner individual
      tags:
      - Account Holder
  /v1/simulate/account_holders/enrollment_review:
    post:
      summary: Simulate an account holder's enrollment review
      description: ' Simulates an enrollment review for an account holder. This endpoint is only applicable for workflows that may required intervention such as `KYB_BASIC`. '
      operationId: simulateAccountHolderEnrollmentReview
      requestBody:
        content:
          application/json:
            examples:
              simulateAcceptedReviewRequest:
                summary: Simulate an accepted enrollment review request
                value:
                  account_holder_token: 1415964d-4400-4d79-9fb3-eee0faaee4e4
                  status: ACCEPTED
                  status_reasons: []
              simulateRejectedReviewRequest:
                summary: Simulate a rejected enrollment review request
                value:
                  account_holder_token: b8d0cdd2-182c-4623-b104-9f50808b8373
                  status: REJECTED
                  status_reasons:
                  - PRIMARY_BUSINESS_ENTITY_ID_VERIFICATION_FAILURE
              simulatePendingReviewRequest:
                summary: Simulate a pending review enrollment review request
                value:
                  account_holder_token: b8d0cdd2-182c-4623-b104-9f50808b8373
                  status: PENDING_REVIEW
                  status_reasons:
                  - CONTROL_PERSON_NAME_VERIFICATION_FAILURE
            schema:
              $ref: '#/components/schemas/simulate-enrollment-review-request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account-holder-response'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - Account Holder
  /v1/simulate/account_holders/enrollment_document_review:
    post:
      summary: Simulate an account holder document upload's review
      description: Simulates a review for an account holder document upload.
      operationId: simulateAccountHolderEnrollmentDocumentReview
      requestBody:
        content:
          application/json:
            examples:
              simulateUploadedReviewRequest:
                summary: Simulate an uploaded enrollment document upload review request
                value:
                  document_upload_token: b11cd67b-0a52-4180-8365-314f3def5426
                  status: UPLOADED
              simulateAcceptedReviewRequest:
                summary: Simulate an accepted enrollment document upload review request
                value:
                  document_upload_token: 70bde493-66a7-454b-8e79-51a0d976a7d2
                  status: ACCEPTED
              simulateRejectedReviewRequest:
                summary: Simulate a rejected enrollment document upload review request
                value:
                  document_upload_token: 30a8fff6-941f-4143-9b7b-e7ac4cbeb91f
                  status: REJECTED
                  status_reason: DOCUMENT_MISSING_REQUIRED_DATA
              simulatePartialApprovalReviewRequest:
                summary: Simulates a partial approval enrollment document upload review request
                value:
                  document_upload_token: 30a8fff6-941f-4143-9b7b-e7ac4cbeb91f
                  status: PARTIAL_APPROVAL
                  status_reason: DOCUMENT_MISSING_REQUIRED_DATA
                  accepted_entity_status_reasons:
                  - PRIMARY_BUSINESS_ENTITY_ID_VERIFICATION_FAILURE
            schema:
              $ref: '#/components/schemas/simulate-enrollment-document-review-request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/document'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
      - Account Holder
components:
  parameters:
    accountHolderToken:
      description: Globally unique identifier for the account holder.
      examples:
        accountHolderTokenExample:
          summary: A sample account holder token
          value: 65db64b2-ae89-491a-97d9-f64788f8b2ab
      in: path
      name: account_holder_token
      required: true
      schema:
        format: uuid
        type: string
    startingAfter:
      description: A cursor representing an item's token after which a page of results should begin. Used to retrieve the next page of results after this item.
      in: query
      name: starting_after
      required: false
      schema:
        type: string
    endTime:
      description: Date string in RFC 3339 format. Only entries created before the specified time will be included. UTC time zone.
      in: query
      name: end
      schema:
        format: date-time
        type: string
    accountHolderTokenPath:
      description: Globally unique identifier for the account holder.
      examples:
        accountHolderTokenExample:
          summary: A sample account holder token
          value: 65db64b2-ae89-491a-97d9-f64788f8b2ab
      in: path
      name: account_holder_token
      required: true
      schema:
        format: uuid
        type: string
    beginTime:
      description: Date string in RFC 3339 format. Only entries created after the specified time will be included. UTC time zone.
      in: query
      name: begin
      schema:
        format: date-time
        type: string
    documentToken:
      description: Globally unique identifier for the document.
      examples:
        documentTokenExample:
          summary: A sample document token
          value: 76ca80c3-bf90-491a-97d9-f64788f8b2ab
      in: path
      name: document_token
      required: true
      schema:
        format: uuid
        type: string
    entityTokenPath:
      description: Globally unique identifier for the entity.
      examples:
        entityTokenExample:
          summary: A sample entity token
          value: 4e541f1a-bf90-491a-97d9-f64788f8b2ab
      in: path
      name: entity_token
      required: true
      schema:
        format: uuid
        type: string
    endingBefore:
      description: A cursor representing an item's token before which a page of results should end. Used to retrieve the previous page of results before this item.
      in: query
      name: ending_before
      required: false
      schema:
        type: string
  schemas:
    document-upload-status-reasons:
      title: Account holder document upload status reasons
      description: The status reasons for an account holder document upload that is not ACCEPTED
      type: string
      enum:
      - DOCUMENT_MISSING_REQUIRED_DATA
      - DOCUMENT_UPLOAD_TOO_BLURRY
      - FILE_SIZE_TOO_LARGE
      - INVALID_DOCUMENT_TYPE
      - INVALID_DOCUMENT_UPLOAD
      - INVALID_ENTITY
      - DOCUMENT_EXPIRED
      - DOCUMENT_ISSUED_GREATER_THAN_30_DAYS
      - DOCUMENT_TYPE_NOT_SUPPORTED
      - UNKNOWN_FAILURE_REASON
      - UNKNOWN_ERROR
    KybDelegated:
      properties:
        beneficial_owner_individuals:
          description: 'You can submit a list of all direct and indirect individuals with 25% or more ownership in the company. A maximum of 4 beneficial owners can be submitted. If no individual owns 25% of the company you do not need to send beneficial owner information.

            See [FinCEN requirements](https://www.fincen.gov/sites/default/files/shared/CDD_Rev6.7_Sept_2017_Certificate.pdf) (Section I) for more background on individuals that should be included.'
          items:
            $ref: '#/components/schemas/KybDelegatedIndividual'
          minItems: 0
          type: array
        business_entity:
          $ref: '#/components/schemas/KybDelegatedBusinessEntity'
          description: Information for business for which the account is being opened.
        control_person:
          $ref: '#/components/schemas/KybDelegatedIndividual'
          description: 'An individual with significant responsibility for managing the legal entity (e.g., a Chief Executive Officer, Chief Financial Officer, Chief Operating Officer,

            Managing Member, General Partner, President, Vice President, or Treasurer). This can be an executive, or someone who will have program-wide access

            to the cards that Lithic will provide. In some cases, this individual could also be a beneficial owner listed above.

            See [FinCEN requirements](https://www.fincen.gov/sites/default/files/shared/CDD_Rev6.7_Sept_2017_Certificate.pdf) (Section II) for more background.

            '
        external_id:
          description: A user provided id that can be used to link an account holder with an external system
          type: string
        naics_code:
          description: 6-digit North American Industry Classification System (NAICS) code for the business.
          example: '541512'
          type: string
        nature_of_business:
          description: Short description of the company's line of business (i.e., what does the company do?). Values longer than 255 characters will be truncated before KYB verification
          example: Software company selling solutions to the restaurant industry
          type: string
        tos_timestamp:
          description: An RFC 3339 timestamp indicating when the account holder accepted the applicable legal agreements (e.g., cardholder terms) as agreed upon during API customer's implementation with Lithic.
          example: '2022-03-08 08:00:00'
          type: string
        website_url:
          description: Company website URL.
          example: www.mybusiness.com
          type: string
        workflow:
          description: Specifies the type of KYB workflow to run.
          enum:
          - KYB_DELEGATED
          type: string
      required:
      - business_entity
      type: object
    KycIndividual:
      allOf:
      - $ref: '#/components/schemas/Individual'
      - required:
        - address
        - dob
        - email
        - first_name
        - government_id
        - last_name
        - phone_number
        type: object
      description: Individuals associated with a KYC application.
      x-stainless-naming:
        java:
          type_name: Individual
    AccountHolder:
      properties:
        account_token:
          description: Globally unique identifier for the account.
          format: uuid
          type: string
        beneficial_owner_individuals:
          description: 'Only present when user_type == "BUSINESS".

            You must submit a list of all direct and indirect individuals with 25% or more ownership in the company. A maximum of 4 beneficial owners can be submitted. If no individual owns 25% of the company you do not need to send beneficial owner information.

            See [FinCEN requirements](https://www.fincen.gov/sites/default/files/shared/CDD_Rev6.7_Sept_2017_Certificate.pdf) (Section I) for more background on individuals that should be included.'
          items:
            $ref: '#/components/schemas/AccountHolderIndividualResponse'
          minItems: 0
          type: array
        business_account_token:
          description: Only applicable for customers using the KYC-Exempt workflow to enroll authorized users of businesses. Pass the account_token of the enrolled business associated with the AUTHORIZED_USER in this field.
          format: uuid
          type: string
        business_entity:
          $ref: '#/components/schemas/AccountHolderBusinessResponse'
          description: Only present when user_type == "BUSINESS". Information about the business for which the account is being opened and KYB is being run.
        control_person:
          $ref: '#/components/schemas/AccountHolderIndividualResponse'
          description: 'Only present when user_type == "BUSINESS".

            An individual with significant responsibility for managing the legal entity (e.g., a Chief Executive Officer, Chief Financial Officer, Chief Operating Officer,

            Managing Member, General Partner, President, Vice President, or Treasurer). This can be an executive, or someone who will have program-wide access

            to the cards that Lithic will provide. In some cases, this individual could also be a beneficial owner listed above.

            '
        created:
          description: Timestamp of when the account holder was created.
          format: date-time
          type: string
        email:
          description: '(Deprecated. Use control_person.email when user_type == "BUSINESS". Use individual.phone_number when user_type == "INDIVIDUAL".)

            Primary email of Account Holder.

            '
          example: '+15555555555'
          type: string
        exemption_type:
          description: The type of KYC exemption for a KYC-Exempt Account Holder.
          enum:
          - AUTHORIZED_USER
          - PREPAID_CARD_USER
          type: string
        external_id:
          description: Customer-provided token that indicates a relationship with an object outside of the Lithic ecosystem.
          type: string
        individual:
          $ref: '#/components/schemas/AccountHolderIndividualResponse'
          description: Only present when user_type == "INDIVIDUAL". Information about the individual for which the account is being opened and KYC is being run.
        naics_code:
          description: Only present when user_type == "BUSINESS". 6-digit North American Industry Classification System (NAICS) code for the business.
          type: string
        nature_of_business:
          description: Only present when user_type == "BUSINESS". User-submitted description of the business.
          type: string
        phone_number:
          description: '(Deprecated. Use control_person.phone_number when user_type == "BUSINESS". Use individual.phone_number when user_type == "INDIVIDUAL".)

            Primary phone of Account Holder, entered in E.164 format.

            '
          example: '+15555555555'
          type: string
        status:
          description: '(Deprecated. Use verification_application.status instead)


            KYC and KYB evaluation states.


            Note:

            * `PENDING_REVIEW` is only applicable for the `KYB_BASIC` workflow.

            '
          enum:
          - ACCEPTED
          - PENDING_REVIEW
          - PENDING_DOCUMENT
          - PENDING_RESUBMIT
          - REJECTED
          type: string
        status_reasons:
          description: '(Deprecated. Use verification_application.status_reasons)


            Reason for the evaluation status.

            '
          items:
            enum:
            - ADDRESS_VERIFICATION_FAILURE
            - AGE_THRESHOLD_FAILURE
            - COMPLETE_VERIFICATION_FAILURE
            - DOB_VERIFICATION_FAILURE
            - ID_VERIFICATION_FAILURE
            - MAX_DOCUMENT_ATTEMPTS
            - MAX_RESUBMISSION_ATTEMPTS
            - NAME_VERIFICATION_FAILURE
            - OTHER_VERIFICATION_FAILURE
            - RISK_THRESHOLD_FAILURE
            - WATCHLIST_ALERT_FAILURE
            type: string
          type: array
        token:
          description: Globally unique identifier for the account holder.
          format: uuid
          type: string
        user_type:
          description: 'The type of Account Holder. If the type is "INDIVIDUAL", the "individual" attribute will be present.

            If the type is "BUSINESS" then the "business_entity", "control_person", "beneficial_owner_individuals", "naics_code", "nature_of_business", and "website_url" attributes will be present.'
          enum:
          - BUSINESS
          - INDIVIDUAL
          type: string
        verification_application:
          $ref: '#/components/schemas/AccountHolderVerificationApplication'
          description: Information about the most recent identity verification attempt
        required_documents:
          description: Only present for "KYB_BASIC" workflow. A list of documents required for the account holder to be approved.
          type: array
          items:
            $ref: '#/components/schemas/required-document'
        website_url:
          description: Only present when user_type == "BUSINESS". Business's primary website.
          type: string
      required:
      - token
      - created
      type: object
    KybIndividual:
      allOf:
      - $ref: '#/components/schemas/Individual'
      - required:
        - address
        - dob
        - email
        - first_name
        - government_id
        - last_name
        type: object
      description: Individuals associated with a KYB application. Phone number is optional.
    kyb-kyc-patch-response:
      title: Business/Individual Patch Response
      type: object
      properties:
        token:
          description: Globally unique identifier for the account holder.
          type: string
          format: uuid
        account_token:
          description: Globally unique identifier for the account.
          type: string
          format: uuid
        business_account_token:
          description: Only applicable for customers using the KYC-Exempt workflow to enroll authorized users of businesses. Pass the account_token of the enrolled business associated with the AUTHORIZED_USER in this field.
          type:
          - string
          - 'null'
          format: uuid
        created:
          description: Timestamp of when the account holder was created.
          type: string
          format: date-time
        exemption_type:
          description: The type of KYC exemption for a KYC-Exempt Account Holder. `null` if the account holder is not KYC-Exempt.
          type: string
          enum:
          - AUTHORIZED_USER
          - PREPAID_CARD_USER
        external_id:
          description: Customer-provided token that indicates a relationship with an object outside of the Lithic ecosystem.
          type: string
        user_type:
          description: 'The type of Account Holder. If the type is "INDIVIDUAL", the "individual" attribute will be present.


            If the type is "BUSINESS" then the "business_entity", "control_person", "beneficial_owner_individuals",

            "naics_code", "nature_of_business", and "website_url" attributes will be present.'
          type: string
          enum:
          - BUSINESS
          - INDIVIDUAL
        verification_application:
          $ref: '#/components/schemas/verification-application'
          description: Information about the most recent identity verification attempt
        individual:
          $ref: '#/components/schemas/individual'
          description: Only present when user_type == "INDIVIDUAL". Information about the individual for which the account is being opened and KYC is being run.
        business_entity:
          $ref: '#/components/schemas/kyb-business-entity'
          description: Only present when user_type == "BUSINESS". Information about the business for which the account is being opened and KYB is being run.
        beneficial_owner_individuals:
          description: Only present when user_type == "BUSINESS". You must submit a list of all direct and indirect individuals with 25% or more ownership in the company. A maximum of 4 beneficial owners can be submitted. If no individual owns 25% of the company you do not need to send beneficial owner information. See [FinCEN requirements](https://www.fincen.gov/sites/default/files/shared/CDD_Rev6.7_Sept_2017_Certificate.pdf) (Section I) for more background on individuals that should be included.
          type: array
          items:
            $ref: '#/components/schemas/individual'
          minItems: 0
        control_person:
          $ref: '#/components/schemas/individual'
          description: 'Only present when user_type == "BUSINESS".


            An individual with significant responsibility for managing the legal entity (e.g., a Chief Executive Officer, Chief Financial Officer, Chief Operating Officer,


            Managing Member, General Partner, President, Vice President, or Treasurer). This can be an executive, or someone who will have program-wide access


            to the cards that Lithic will provide. In some cases, this individual could also be a beneficial owner listed above.'
        naics_code:
          description: Only present when user_type == "BUSINESS". 6-digit North American Industry Classification System (NAICS) code for the business.
          type: string
        nature_of_business:
          description: Only present when user_type == "BUSINESS". User-submitted description of the business.
          type: string
        website_url:
          description: Only present when user_type == "BUSINESS". Business's primary website.
          type: string
        email:
          description: '(Deprecated. Use control_person.email when user_type == "BUSINESS".

            Use individual.phone_number when user_type == "INDIVIDUAL".)

            Primary email of Account Holder.

            '
          type: string
        phone_number:
          description: '(Deprecated. Use control_person.phone_number when user_type == "BUSINESS".

            Use individual.phone_number when user_type == "INDIVIDUAL".)

            Primary phone of Account Holder, entered in E.164 format.

            '
          type: string
        status:
          description: '(Deprecated. Use verification_application.status instead)

            KYC and KYB evaluation states.


            Note: `PENDING_RESUBMIT` and `PENDING_DOCUMENT` are only applicable for the `ADVANCED` workflow.


            '
          $ref: '#/components/schemas/status'
        status_reasons:
          description: "(Deprecated. Use verification_application.status_reasons)\n Reason for the evaluation status."
          type: array
          items:
            $ref: '#/components/schemas/status-reasons'
        required_documents:
          description: Only present for "KYB_BASIC" and "KYC_ADVANCED" workflows. A list of documents required for the account holder to be approved.
          type: array
          items:
            $ref: '#/components/schemas/required-document'
    create-entity-response:
      title: Account Holder Entity Create Response
      type: object
      description: Response body for creating a new beneficial owner or replacing the control person entity on an existing KYB account holder.
      properties:
        account_holder_token:
          type: string
          format: uuid
          description: Globally unique identifier for the account holder
        created:
          type: string
          format: date-time
          description: Timestamp of when the entity was created
        status:
          $ref: '#/components/schemas/entity-status'
          description: Entity verification status
        status_reasons:
          type: array
          description: Reason for the evaluation status
          items:
            $ref: '#/components/schemas/status-reasons'
        required_documents:
          type: array
          description: A list of documents required for the entity to be approved
          items:
            $ref: '#/components/schemas/required-document'
        token:
          type: string
          format: uuid
          description: Globally unique identifier for the entity
      required:
      - account_holder_token
      - created
      - status
      - status_reasons
      - token
      - required_documents
    kyb-business-entity:
      title: KYB Business Entity
      type: object
      properties:
        address:
          $ref: '#/components/schemas/address'
          description: Business''s physical address - PO boxes, UPS drops, and FedEx drops are not acceptable; APO/FPO are acceptable.
        dba_business_name:
          description: Any name that the business operates under that is not its legal business name (if applicable).
          type: string
        government_id:
          description: Government-issued identification number. US Federal Employer Identification Numbers (EIN) are currently supported, entered as full nine-digits, with or without hyphens.
          example: 114-123-1513
          type: string
        legal_business_name:
          description: Legal (formal) business name.
          example: Acme, Inc.
          type: string
        parent_company:
          description: Parent company name (if applicable).
          type: string
        phone_numbers:
          description: One or more of the business's phone number(s), entered as a list in E.164 format.
