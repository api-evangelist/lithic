            - status
            - status_reasons
            - upload_url
            - token
            - created
            - updated
            - accepted_entity_status_reasons
            - rejected_entity_status_reasons
      required:
      - account_holder_token
      - document_type
      - entity_token
      - required_document_uploads
      - token
