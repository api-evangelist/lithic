    spend-velocity-filters:
      title: Spend Velocity Filters
      allOf:
      - $ref: '#/components/schemas/velocity-limit-filters'
      - type: object
        properties:
          include_tags:
            type:
            - 'null'
            - object
            additionalProperties:
              type: string
            description: Tag key-value pairs to include in the velocity calculation. Only transactions matching all specified tag key-value pairs will be included in the calculated velocity.
          exclude_tags:
            type:
            - 'null'
            - object
            additionalProperties:
              type: string
            description: Tag key-value pairs to exclude from the velocity calculation. Transactions matching all specified tag key-value pairs will be excluded from the calculated velocity.
  responses:
    responses-BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthRule:
      description: Auth Rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/auth-rule'
    responses-NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    AuthRuleBacktestToken:
      name: auth_rule_backtest_token
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StartingAfter:
      description: A cursor representing an item's token after which a page of results should begin. Used to retrieve the next page of results after this item.
      in: query
      name: starting_after
      required: false
      schema:
        type: string
        format: uuid
    EndingBefore:
      description: A cursor representing an item's token before which a page of results should end. Used to retrieve the previous page of results before this item.
      in: query
      name: ending_before
      required: false
      schema:
        type: string
        format: uuid
    PageSize:
      description: Page size (for pagination).
      in: query
      name: page_size
      schema:
        default: 50
        maximum: 100
        minimum: 1
        type: integer
    AuthRuleToken:
      name: auth_rule_token
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: Authorization
