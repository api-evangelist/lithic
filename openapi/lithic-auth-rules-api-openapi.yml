          - period
        - title: Transaction History Signals Feature
          type: object
          properties:
            type:
              type: string
              const: TRANSACTION_HISTORY_SIGNALS
            scope:
              type: string
              description: The entity scope to load transaction history signals for.
              enum:
              - CARD
              - ACCOUNT
              - BUSINESS_ACCOUNT
          required:
          - type
          - scope
        discriminator:
          propertyName: type
