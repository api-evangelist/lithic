  /v1/embed/card:
    get:
      description: "Handling full card PANs and CVV codes requires that you comply with the Payment Card Industry Data Security Standards (PCI DSS). Some clients choose to reduce their compliance obligations by leveraging our embedded card UI solution documented below.\n\nIn this setup, PANs and CVV codes are presented to the end-user via a card UI that we provide, optionally styled in the customer's branding using a specified css stylesheet. A user's browser makes the request directly to api.lithic.com, so card PANs and CVVs never touch the API customer's servers while full card data is displayed to their end-users. The response contains an HTML document (see Embedded Card UI or Changelog for upcoming changes in January). This means that the url for the request can be inserted straight into the `src` attribute of an iframe.\n\n```html\n<iframe id=\"card-iframe\"\n        src=\"https://sandbox.lithic.com/v1/embed/card?embed_request=eyJjc3MiO...;hmac=r8tx1...\"\n        allow=\"clipboard-write\" class=\"content\"></iframe>\n```\n\nYou should compute the request payload on the server side. You can render it (or the whole iframe) on the server or make an ajax call from your front end code, but **do not ever embed your API key into front end code, as doing so introduces a serious security vulnerability**.\n"
      operationId: getEmbedCard
      parameters:
      - description: A base64 encoded JSON string of an EmbedRequest to specify which card to load.
        in: query
        name: embed_request
        required: true
        schema:
          type: string
      - description: SHA256 HMAC of the embed_request JSON string with base64 digest.
        in: query
        name: hmac
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/html:
              examples:
                html:
                  summary: Card UI
                  value: "<html>\n<head>\n<link rel=\"stylesheet\" type=\"text/css\" href=\"https://demo.lithic.com/backend/embedded.css\">\n<style>\n    #alert { display: none; }\n</style>\n<script type=\"text/javascript\">\n    var timeout;\n\n    function clearAlertDelay() {\n        clearTimeout(timeout);\n        var messageDiv = document.getElementById('alert');\n        timeout = window.setTimeout(\n            function() {\n                messageDiv.className = \"empty\";\n                messageDiv.innerText = \"\";\n            },\n            1200\n        );\n    }\n\n    function copySuccess(divId) {\n        var messageDiv = document.getElementById('alert');\n        messageDiv.innerText = divId + \" copied to clipboard\";\n        messageDiv.className = \"success\";\n        console.log('Copying to clipboard was successful!');\n        clearAlertDelay();\n    }\n\n    function copyFailed(divId) {\n        var messageDiv = document.getElementById('alert');\n        messageDiv.innerText = \"error copying \" + divId;\n        messageDiv.className = \"error\";\n        console.error('Copying to clipboard failed');\n        clearAlertDelay();\n    }\n\n    function copyToClip(divId) {\n        var messageDiv = document.getElementById('alert');\n        var copyEl = document.getElementById(divId);\n        var copyText = copyEl.textContent;\n        navigator.clipboard.writeText(copyText)\n            .then(function () {\n                copySuccess(divId);\n                clearAlertDelay();\n            })\n            .catch(function(err) {\n                try {\n                    var copied = false;\n                    if (document.createRange) {\n                        range = document.createRange();\n                        range.selectNode(copyEl)\n                        select = window.getSelection();\n                        select.removeAllRanges();\n                        select.addRange(range);\n                        copied = document.execCommand('copy');\n                        select.removeAllRanges();\n                    }\n                    else {\n                        range = document.body.createTextRange();\n                        range.moveToElementText(copyEl);\n                        range.select();\n                        copied = document.execCommand('copy');\n                    }\n\n                    if (copied) {\n                        copySuccess(divId);\n                    }\n                    else {\n                        copyFailed(divId);\n                    }\n                }\n                catch (err) {\n                    copyFailed(divId);\n                }\n                clearAlertDelay();\n            })\n    }\n</script>\n</head>\n<body>\n    <div id=\"card\">\n        <div id=\"pan\" onclick=\"copyToClip('pan')\">9999<span class='pan-separator'></span>9999<span class='pan-separator'></span>9999<span class='pan-separator'></span>9999</div>\n        <div id=\"expiry\">\n            <span id=\"month\" onclick=\"copyToClip('month')\">08</span>\n            <span id=\"separator\">/</span>\n            <span id=\"year\" onclick=\"copyToClip('year')\">27</span>\n        </div>\n        <div id=\"cvv\" onclick=\"copyToClip('cvv')\">574</div>\n        <div id=\"alert\" class=\"empty\"></div>\n    </div>\n</body>\n</html>\n"
              schema:
                type: string
          description: 'The endpoint returns an HTML document similar to the one below. It is up to the API client to provide css styles for these elements in the EmbedRequest. You can always rely on the `card`, `pan`, `expiry`, `cvv`, and `alert` ids, as well as the `pan-separator` class. You shouldn''t make any other assumptions about the structure of the document as it could change at any time.


            Note that using the default style sheet there is no visual indication that copying is happening on-click, and you may need to add on-click styling yourself.

            '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Embedded card UI
      tags:
      - Card
components:
  parameters:
    idempotencyKey:
      description: Idempotency key for the request
      in: header
      name: Idempotency-Key
      schema:
        type: string
        format: uuid
      example: 65a9dad4-1b60-4686-83fd-65b25078a4b4
    cardProgramTokenPath:
      description: Globally unique identifier for the card program.
      examples:
        cardProgramTokenExample:
          summary: A sample card program token
          value: 65db64b2-ae89-491a-97d9-f64788f8b2ab
      in: path
      name: card_program_token
      required: true
      schema:
        format: uuid
        type: string
    startingAfter:
      description: A cursor representing an item's token after which a page of results should begin. Used to retrieve the next page of results after this item.
      in: query
      name: starting_after
      required: false
      schema:
        type: string
    financialTransactionToken:
      description: Globally unique identifier for financial transaction token.
      examples:
        financialTransactionTokenExample:
          summary: A sample financial transaction token
          value: 18394f8e-711b-4b3e-ae21-d35a9eafe7d1
      in: path
      name: financial_transaction_token
      required: true
      schema:
        format: uuid
        type: string
    endTime:
      description: Date string in RFC 3339 format. Only entries created before the specified time will be included. UTC time zone.
      in: query
      name: end
      schema:
        format: date-time
        type: string
    beginTime:
      description: Date string in RFC 3339 format. Only entries created after the specified time will be included. UTC time zone.
      in: query
      name: begin
      schema:
        format: date-time
        type: string
    cardToken:
      examples:
        cardTokenExample:
          summary: A sample card token
          value: 73ca53a1-ae89-491a-97d9-f64788f8b2ab
      in: path
      name: card_token
      required: true
      schema:
        format: uuid
        type: string
    endingBefore:
      description: A cursor representing an item's token before which a page of results should end. Used to retrieve the previous page of results before this item.
      in: query
      name: ending_before
      required: false
      schema:
        type: string
    pageSize:
      description: Page size (for pagination).
      in: query
      name: page_size
      schema:
        default: 50
        maximum: 100
        minimum: 1
        type: integer
    cardTokenDigitalWallet:
      description: The unique token of the card to add to the device's digital wallet.
      examples:
        cardTokenExample:
          summary: A sample card token
          value: 73ca53a1-ae89-491a-97d9-f64788f8b2ab
      in: path
      name: card_token
      required: true
      schema:
        format: uuid
        type: string
  schemas:
    funding_account:
      description: Funding account for a card
      type: object
      properties:
        account_name:
          description: Account name identifying the funding source. This may be `null`.
          type: string
        created:
          description: An RFC 3339 string representing when this funding source was added to the Lithic account. This may be `null`. UTC time zone.
          format: date-time
          type: string
        last_four:
          description: The last 4 digits of the account (e.g. bank account, debit card) associated with this FundingAccount. This may be null.
          maxLength: 4
          minLength: 4
          type: string
        nickname:
          description: The nickname given to the `FundingAccount` or `null` if it has no nickname.
          maxLength: 255
          minLength: 1
          type:
          - string
          - 'null'
        state:
          description: 'State of funding source. Funding source states: * `ENABLED` - The funding account is available to use for card creation and transactions. * `PENDING` - The funding account is still being verified e.g. bank micro-deposits verification. * `DELETED` - The founding account has been deleted.'
          enum:
          - DELETED
          - ENABLED
          - PENDING
          type: string
        token:
          description: A globally unique identifier for this FundingAccount.
          format: uuid
          type: string
        type:
          description: 'Types of funding source: * `DEPOSITORY_CHECKING` - Bank checking account. * `DEPOSITORY_SAVINGS` - Bank savings account.'
          enum:
          - DEPOSITORY_CHECKING
          - DEPOSITORY_SAVINGS
          type: string
      required:
      - created
      - last_four
      - state
      - token
      - type
    CardProgram:
      properties:
        account_level_management_enabled:
          description: Whether the card program is participating in Account Level Management. Currently applicable to Visa card programs only.
          type: boolean
        cardholder_currency:
          description: 3-character alphabetic ISO 4217 code for the currency of the cardholder.
          example: USD
          type: string
        created:
          description: Timestamp of when the card program was created.
          format: date-time
          type: string
        name:
          description: The name of the card program.
          example: My Prepaid Program
          type: string
        pan_range_end:
          description: The first digits of the card number that this card program ends with.
          example: '52304803'
          type: string
        pan_range_start:
          description: The first digits of the card number that this card program starts with.
          example: '52304803'
          type: string
        settlement_currencies:
          description: List of 3-character alphabetic ISO 4217 codes for the currencies that the card program supports for settlement.
          example:
          - USD
          - CAD
          items:
            type: string
          type: array
        token:
          description: Globally unique identifier.
          format: uuid
          type: string
      required:
      - account_level_management_enabled
      - created
      - name
      - pan_range_end
      - pan_range_start
      - token
      type: object
    signals-response:
      title: Signals Response
      description: 'Behavioral feature state for a card or account derived from its transaction history.


        Derived statistical features (averages, standard deviations, z-scores) are computed using Welford''s online algorithm over approved transactions. Average fields are null when fewer than 5 approved transactions have been recorded. Standard deviation fields are null when fewer than 30 approved transactions have been recorded.


        3DS fields (`three_ds_success_rate`, `three_ds_success_count`, `three_ds_total_count`) are card-scoped and will be null for account responses.


        Raw fields (`seen_countries`, `seen_mccs`, `approved_txn_amount_m2`, etc.) are included so clients can compute their own transaction-specific derivations, such as checking whether a new transaction''s country is in `seen_countries` to determine `is_new_country`, or computing a z-score using the raw mean and M2 values.'
      type: object
      properties:
        avg_transaction_amount:
          type:
          - number
          - 'null'
          description: The average approved transaction amount over the entity's lifetime, in cents. Null if fewer than 5 approved transactions have been recorded.
        stdev_transaction_amount:
          type:
          - number
          - 'null'
          description: The standard deviation of approved transaction amounts over the entity's lifetime, in cents. Null if fewer than 30 approved transactions have been recorded.
        approved_txn_count:
          type:
          - integer
          - 'null'
          description: The total number of approved transactions over the entity's lifetime.
        avg_transaction_amount_7d:
          type:
          - number
          - 'null'
          description: The average approved transaction amount over the last 7 days, in cents. Null if fewer than 5 approved transactions in window.
        stdev_transaction_amount_7d:
          type:
          - number
          - 'null'
          description: The standard deviation of approved transaction amounts over the last 7 days, in cents. Null if fewer than 30 approved transactions in window.
        approved_txn_count_7d:
          type:
          - integer
          - 'null'
          description: The number of approved transactions in the last 7 days.
        avg_transaction_amount_30d:
          type:
          - number
          - 'null'
          description: The average approved transaction amount over the last 30 days, in cents. Null if fewer than 5 approved transactions in window.
        stdev_transaction_amount_30d:
          type:
          - number
          - 'null'
          description: The standard deviation of approved transaction amounts over the last 30 days, in cents. Null if fewer than 30 approved transactions in window.
        approved_txn_count_30d:
          type:
          - integer
          - 'null'
          description: The number of approved transactions in the last 30 days.
        avg_transaction_amount_90d:
          type:
          - number
          - 'null'
          description: The average approved transaction amount over the last 90 days, in cents. Null if fewer than 5 approved transactions in window.
        stdev_transaction_amount_90d:
          type:
          - number
          - 'null'
          description: The standard deviation of approved transaction amounts over the last 90 days, in cents. Null if fewer than 30 approved transactions in window.
        approved_txn_count_90d:
          type:
          - integer
          - 'null'
          description: The number of approved transactions in the last 90 days.
        is_first_transaction:
          type:
          - boolean
          - 'null'
          description: Whether the entity has no prior transaction history. Returns true if no history is found. Null if transaction history exists but a first transaction timestamp is unavailable.
        time_since_last_transaction_days:
          type:
          - number
          - 'null'
          description: The number of days since the last approved transaction on the entity.
        three_ds_success_rate:
          type:
          - number
          - 'null'
          description: The 3DS authentication success rate for the card, as a percentage from 0.0 to 100.0. Null for account responses.
        distinct_country_count:
          type:
          - integer
          - 'null'
          description: The number of distinct merchant countries seen in the entity's transaction history.
        distinct_mcc_count:
          type:
          - integer
          - 'null'
          description: The number of distinct MCCs seen in the entity's transaction history.
        seen_countries:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The set of merchant countries seen in the entity's transaction history. Clients can use this to determine whether a new transaction's country is novel (i.e. compute `is_new_country`).
        seen_mccs:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The set of MCCs seen in the entity's transaction history. Clients can use this to determine whether a new transaction's MCC is novel (i.e. compute `is_new_mcc`).
        seen_merchants:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The set of card acceptor IDs seen in the card's approved transaction history, capped at the 1000 most recently seen. Null for account responses. Clients can use this to determine whether a new transaction's merchant is novel (i.e. compute `is_new_merchant`).
        first_txn_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The timestamp of the first approved transaction for the entity, in ISO 8601 format.
        last_txn_approved_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The timestamp of the most recent approved transaction for the entity, in ISO 8601 format.
        last_cp_country:
          type:
          - string
          - 'null'
          description: The merchant country of the last card-present transaction. Clients can use this together with `last_cp_timestamp` to detect impossible travel.
        last_cp_postal_code:
          type:
          - string
          - 'null'
          description: The merchant postal code of the last card-present transaction.
        last_cp_timestamp:
          type:
          - string
          - 'null'
          format: date-time
          description: The timestamp of the last card-present transaction, in ISO 8601 format.
        approved_txn_amount_m2:
          type:
          - number
          - 'null'
          description: The Welford M2 accumulator for lifetime approved transaction amounts. Used together with `avg_transaction_amount` and `approved_txn_count` to compute the z-score of a new transaction amount (variance = M2 / (count - 1)).
        approved_txn_amount_m2_7d:
          type:
          - number
          - 'null'
          description: The Welford M2 accumulator for approved transaction amounts over the last 7 days.
        approved_txn_amount_m2_30d:
          type:
          - number
          - 'null'
          description: The Welford M2 accumulator for approved transaction amounts over the last 30 days.
        approved_txn_amount_m2_90d:
          type:
          - number
          - 'null'
          description: The Welford M2 accumulator for approved transaction amounts over the last 90 days.
        three_ds_success_count:
          type:
          - integer
          - 'null'
          description: The number of successful 3DS authentications for the card. Null for account responses.
        three_ds_total_count:
          type:
          - integer
          - 'null'
          description: The total number of 3DS authentication attempts for the card. Null for account responses.
      required:
      - avg_transaction_amount
      - stdev_transaction_amount
      - approved_txn_count
      - avg_transaction_amount_7d
      - stdev_transaction_amount_7d
      - approved_txn_count_7d
      - avg_transaction_amount_30d
      - stdev_transaction_amount_30d
      - approved_txn_count_30d
      - avg_transaction_amount_90d
      - stdev_transaction_amount_90d
      - approved_txn_count_90d
      - is_first_transaction
      - time_since_last_transaction_days
      - three_ds_success_rate
      - distinct_country_count
      - distinct_mcc_count
      - seen_countries
      - seen_mccs
      - seen_merchants
      - first_txn_at
      - last_txn_approved_at
      - last_cp_country
      - last_cp_postal_code
      - last_cp_timestamp
      - approved_txn_amount_m2
      - approved_txn_amount_m2_7d
      - approved_txn_amount_m2_30d
      - approved_txn_amount_m2_90d
      - three_ds_success_count
      - three_ds_total_count
    GoogleWebPushProvisioningResponse:
      properties:
        google_opc:
          description: A base64 encoded and encrypted payload representing card data for the Google Pay UWPP FPAN flow.
          example: WW91ciBTdHJpbmcgSGVyZQ==
          type: string
        tsp_opc:
          description: A base64 encoded and encrypted payload representing card data for the Google Pay UWPP tokenization flow.
          example: WW91ciBTdHJpbmcgSGVyZQ==
          type: string
      type: object
      not:
        properties:
          jws: {}
        required:
        - jws
    WebPushProvisioningResponse:
      oneOf:
      - $ref: '#/components/schemas/AppleWebPushProvisioningResponse'
      - $ref: '#/components/schemas/GoogleWebPushProvisioningResponse'
    non_pci_card_response:
      description: Card details without PCI information
      type: object
      properties:
        account_token:
          description: Globally unique identifier for the account to which the card belongs.
          example: f3f4918c-dee9-464d-a819-4aa42901d624
          type: string
        auth_rule_tokens:
          description: List of identifiers for the Auth Rule(s) that are applied on the card. This field is deprecated and will no longer be populated in the `Card` object. The key will be removed from the schema in a future release. Use the `/auth_rules` endpoints to fetch Auth Rule information instead.
          items:
            type: string
          type: array
          deprecated: true
        card_program_token:
          description: Globally unique identifier for the card program on which the card exists.
          example: 5e9483eb-8103-4e16-9794-2106111b2eca
          type: string
        bulk_order_token:
          description: Globally unique identifier for the bulk order associated with this card. Only applicable to physical cards that are part of a bulk shipment
          example: 5e9483eb-8103-4e16-9794-2106111b2eca
          format: uuid
          type:
          - string
          - 'null'
        replacement_for:
          description: If the card is a replacement for another card, the globally unique identifier for the card that was replaced.
          example: 5e9483eb-8103-4e16-9794-2106111b2eca
          type:
          - string
          - 'null'
        cardholder_currency:
          description: 3-character alphabetic ISO 4217 code for the currency of the cardholder.
          example: USD
          type: string
        created:
          description: An RFC 3339 timestamp for when the card was created. UTC time zone.
          example: '2021-06-28T22:53:15Z'
          format: date-time
          type: string
        digital_card_art_token:
          description: Specifies the digital card art to be displayed in the user's digital wallet after tokenization. This artwork must be approved by Mastercard and configured by Lithic to use.
          example: 5e9483eb-8103-4e16-9794-2106111b2eca
          type:
          - string
          - 'null'
        exp_month:
          description: Two digit (MM) expiry month.
          example: '06'
          maxLength: 2
          minLength: 2
          type: string
        exp_year:
          description: Four digit (yyyy) expiry year.
          example: '2027'
          maxLength: 4
          minLength: 4
          type: string
        funding:
          description: 'Deprecated: Funding account for the card.'
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/funding_account'
        hostname:
          description: Hostname of card's locked merchant (will be empty if not applicable).
          type: string
        last_four:
          description: Last four digits of the card number.
          maxLength: 4
          minLength: 4
          type: string
        memo:
          description: Friendly name to identify the card.
          example: New Card
          type: string
        network_program_token:
          description: Globally unique identifier for the card's network program. Null if the card is not associated with a network program. Currently applicable to Visa cards participating in Account Level Management only
          example: 5e9483eb-8103-4e16-9794-2106111b2eca
          type:
          - string
          - 'null'
        pending_commands:
          description: 'Indicates if there are offline PIN changes pending card interaction with an offline PIN terminal. Possible commands are: CHANGE_PIN, UNBLOCK_PIN. Applicable only to cards issued in markets supporting offline PINs.'
          items:
            type: string
          type: array
        pin_status:
          description: Indicates if a card is blocked due a PIN status issue (e.g. excessive incorrect attempts).
          enum:
          - OK
          - BLOCKED
          - NOT_SET
          type: string
        product_id:
          description: Only applicable to cards of type `PHYSICAL`. This must be configured with Lithic before use. Specifies the configuration (i.e., physical card art) that the card should be manufactured with.
          example: '1'
          type:
          - string
          - 'null'
        spend_limit:
          description: Amount (in cents) to limit approved authorizations (e.g. 100000 would be a $1,000 limit). Transaction requests above the spend limit will be declined.
          example: 1000
          type: integer
        spend_limit_duration:
          $ref: '#/components/schemas/spend_limit_duration'
        state:
          description: 'Card state values: * `CLOSED` - Card will no longer approve authorizations. Closing a card cannot be undone. * `OPEN` - Card will approve authorizations (if they match card and account parameters). * `PAUSED` - Card will decline authorizations, but can be resumed at a later time. * `PENDING_FULFILLMENT` - The initial state for cards of type `PHYSICAL`. The card is provisioned pending manufacturing and fulfillment. Cards in this state can accept authorizations for e-commerce purchases, but not for "Card Present" purchases where the physical card itself is present. * `PENDING_ACTIVATION` - At regular intervals, cards of type `PHYSICAL` in state `PENDING_FULFILLMENT` are sent to the card production warehouse and updated to state `PENDING_ACTIVATION`. Similar to `PENDING_FULFILLMENT`, cards in this state can be used for e-commerce transactions or can be added to mobile wallets. API clients should update the card''s state to `OPEN` only after the cardholder confirms receipt of the card. In sandbox, the same daily batch fulfillment occurs, but no cards are actually manufactured.'
          enum:
          - CLOSED
          - OPEN
          - PAUSED
          - PENDING_ACTIVATION
          - PENDING_FULFILLMENT
          type: string
        substatus:
          description: 'Card state substatus values: * `LOST` - The physical card is no longer in the cardholder''s possession due to being lost or never received by the cardholder. * `COMPROMISED` - Card information has been exposed, potentially leading to unauthorized access. This may involve physical card theft, cloning, or online data breaches. * `DAMAGED` - The physical card is not functioning properly, such as having chip failures or a demagnetized magnetic stripe. * `END_USER_REQUEST` - The cardholder requested the closure of the card for reasons unrelated to fraud or damage, such as switching to a different product or closing the account. * `ISSUER_REQUEST` - The issuer closed the card for reasons unrelated to fraud or damage, such as account inactivity, product or policy changes, or technology upgrades. * `NOT_ACTIVE` - The card hasn’t had any transaction activity for a specified period, applicable to statuses like `PAUSED` or `CLOSED`. * `SUSPICIOUS_ACTIVITY` - The card has one or more suspicious transactions or activities that require review. This can involve prompting the cardholder to confirm legitimate use or report confirmed fraud. * `INTERNAL_REVIEW` - The card is temporarily paused pending further internal review. * `EXPIRED` - The card has expired and has been closed without being reissued. * `UNDELIVERABLE` - The card cannot be delivered to the cardholder and has been returned. * `OTHER` - The reason for the status does not fall into any of the above categories. A comment can be provided to specify the reason.'
          enum:
          - LOST
          - COMPROMISED
          - DAMAGED
          - END_USER_REQUEST
          - ISSUER_REQUEST
          - NOT_ACTIVE
          - SUSPICIOUS_ACTIVITY
          - INTERNAL_REVIEW
          - EXPIRED
          - UNDELIVERABLE
          - OTHER
          type:
          - string
          - 'null'
        comment:
          description: Additional context or information related to the card.
          type: string
        token:
          description: Globally unique identifier.
          example: 7ef7d65c-9023-4da3-b113-3b8583fd7951
          type: string
        type:
          description: 'Card types: * `VIRTUAL` - Card will authorize at any merchant and can be added to a digital wallet like Apple Pay or Google Pay (if the card program is digital wallet-enabled). * `PHYSICAL` - Manufactured and sent to the cardholder. We offer white label branding, credit, ATM, PIN debit, chip/EMV, NFC and magstripe functionality. * `SINGLE_USE` - Card is closed upon first successful authorization. * `MERCHANT_LOCKED` - Card is locked to the first merchant that successfully authorizes the card. * `UNLOCKED` - *[Deprecated]* Similar behavior to VIRTUAL cards, please use VIRTUAL instead. * `DIGITAL_WALLET` - *[Deprecated]* Similar behavior to VIRTUAL cards, please use VIRTUAL instead.'
          enum:
          - MERCHANT_LOCKED
          - PHYSICAL
          - SINGLE_USE
          - VIRTUAL
          - UNLOCKED
          - DIGITAL_WALLET
          type: string
      required:
      - account_token
      - card_program_token
      - created
      - funding
      - last_four
      - pin_status
      - spend_limit
      - spend_limit_duration
      - state
      - token
      - type
    ShippingAddress:
      properties:
        address1:
          description: Valid USPS routable address.
          example: 5 Broad Street
          maxLength: 40
          minLength: 1
          type: string
        address2:
          description: Unit number (if applicable).
          example: Unit 25A
          maxLength: 40
          minLength: 1
          type: string
        city:
          description: City
          example: NEW YORK
          maxLength: 30
          minLength: 1
          type: string
        country:
          description: Uppercase ISO 3166-1 alpha-3 three character abbreviation.
          example: USA
          maxLength: 3
          minLength: 3
          type: string
        email:
          description: Email address to be contacted for expedited shipping process purposes. Required if `shipping_method` is `EXPEDITED`.
          example: johnny@appleseed.com
          maxLength: 50
          minLength: 5
          type: string
        first_name:
          description: Customer's first name. This will be the first name printed on the physical card. The combined length of `first_name` and `last_name` may not exceed 25 characters.
          example: Michael
          maxLength: 24
          minLength: 1
          type: string
        last_name:
          description: Customer's surname (family name). This will be the last name printed on the physical card. The combined length of `first_name` and `last_name` may not exceed 25 characters.
          example: Bluth
          maxLength: 24
          minLength: 1
          type: string
        line2_text:
          description: Text to be printed on line two of the physical card. Use of this field requires additional permissions.
          example: The Bluth Company
          maxLength: 26
          minLength: 0
          type: string
        phone_number:
          description: Cardholder's phone number in E.164 format to be contacted for expedited shipping process purposes. Required if `shipping_method` is `EXPEDITED`.
          example: '+15555555555'
          maxLength: 16
          minLength: 8
          type: string
        postal_code:
          description: Postal code (formerly zipcode). For US addresses, either five-digit postal code or nine-digit postal code (ZIP+4) using the format 12345-1234.
          example: 10001-1809
          maxLength: 12
          minLength: 1
          type: string
        state:
          description: Uppercase ISO 3166-2 two character abbreviation for US and CA. Optional with a limit of 24 characters for other countries.
          example: NY
          maxLength: 24
          minLength: 0
          type: string
      required:
      - address1
      - city
      - country
      - first_name
      - last_name
      - postal_code
      - state
      type: object
    CardSpendLimits:
      properties:
        available_spend_limit:
          properties:
            annually:
              description: The available spend limit (in cents) relative to the annual limit configured on the Card (e.g. 100000 would be a $1,000 limit).
              example: 200000
              type: integer
            forever:
              description: The available spend limit (in cents) relative to the forever limit configured on the Card.
              example: 300000
              type: integer
            monthly:
              description: The available spend limit (in cents) relative to the monthly limit configured on the Card.
              example: 200000
              type: integer
          type: object
        spend_limit:
          properties:
            annually:
              description: The configured annual spend limit (in cents) on the Card.
              example: 500000
              type: integer
            forever:
              description: The configured forever spend limit (in cents) on the Card.
              example: 500000
              type: integer
            monthly:
              description: The configured monthly spend limit (in cents) on the Card.
              example: 500000
              type: integer
          type: object
        spend_velocity:
          properties:
            annually:
              description: Current annual spend velocity (in cents) on the Card. Present if annual spend limit is set.
              example: 300000
              type: integer
            forever:
              description: Current forever spend velocity (in cents) on the Card. Present if forever spend limit is set.
              example: 200000
              type: integer
            monthly:
              description: Current monthly spend velocity (in cents) on the Card. Present if monthly spend limit is set.
              example: 300000
              type: integer
          type: object
      required:
      - available_spend_limit
      type: object
