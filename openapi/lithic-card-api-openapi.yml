    Carrier:
      properties:
        qr_code_url:
          description: QR code URL to display on the card carrier. The `qr_code_url` field requires your domain to be allowlisted by Lithic before use. Contact Support to configure your QR code domain
          type: string
      type: object
    spend_limit_duration:
      description: 'Spend limit duration values:


        * `ANNUALLY` - Card will authorize transactions up to spend limit for the trailing year.

        * `FOREVER` - Card will authorize only up to spend limit for the entire lifetime of the card.

        * `MONTHLY` - Card will authorize transactions up to spend limit for the trailing month. To support recurring monthly payments, which can occur on different day every month, the time window we consider for monthly velocity starts 6 days after the current calendar date one month prior.

        * `TRANSACTION` - Card will authorize multiple transactions if each individual transaction is under the spend limit.'
      type: string
      enum:
      - ANNUALLY
      - FOREVER
      - MONTHLY
      - TRANSACTION
    financial_event:
      title: Financial Event
      description: Financial Event
      type: object
      properties:
        amount:
          description: Amount of the financial event that has been settled in the currency's smallest unit (e.g., cents).
          type: integer
        created:
          description: Date and time when the financial event occurred. UTC time zone.
          type: string
          format: date-time
        result:
          description: APPROVED financial events were successful while DECLINED financial events were declined by user, Lithic, or the network.
          type: string
          enum:
          - APPROVED
          - DECLINED
        token:
          description: Globally unique identifier.
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/financial_event_type'
    AppleWebPushProvisioningResponse:
      properties:
        jws:
          $ref: '#/components/schemas/WebPushProvisioningResponseJws'
          description: JWS object required for handoff to Apple's script.
        state:
          description: A unique identifier for the JWS object.
          example: 3cc4c292-727b-4ca8-b9a8-f96c15485f4e
          type: string
      required:
      - jws
      - state
      type: object
    pci_card_response:
      description: Card details with potentially PCI sensitive information for Enterprise customers
      allOf:
      - $ref: '#/components/schemas/non_pci_card_response'
      - type: object
        properties:
          pan:
            description: Primary Account Number (PAN) (i.e. the card number). Customers must be PCI compliant to have PAN returned as a field in production. Please contact support@lithic.com for questions.
            example: '4111111289144142'
            maxLength: 16
            minLength: 16
            type: string
          cvv:
            description: Three digit cvv printed on the back of the card.
            example: '776'
            maxLength: 3
            minLength: 3
            type: string
        examples:
        - pan: '4111111289144142'
          cvv: '776'
    error:
      type: object
      properties:
