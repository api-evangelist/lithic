                summary: Reissue card with a new address
                value:
                  carrier:
                    qr_code_url: https://lithic.com/activate-card/1
                  product_id: '100'
                  shipping_address:
                    address1: 5 Broad Street
                    address2: Unit 5A
                    city: NEW YORK
                    country: USA
                    first_name: Janet
                    last_name: Yellen
                    postal_code: '10001'
                    state: NY
                  shipping_method: STANDARD
