      example: USD
      type: string
    hold_transaction:
      title: Hold Transaction
      description: A hold transaction representing reserved funds on a financial account. Holds move funds from available to pending balance in anticipation of future payments. They can be resolved via settlement (linked to payment), manual release, or expiration.
      allOf:
      - $ref: '#/components/schemas/base_transaction'
      - type: object
        properties:
          family:
            type: string
            const: HOLD
            description: HOLD - Hold Transaction
          result:
            $ref: '#/components/schemas/transaction_result'
          status:
            $ref: '#/components/schemas/hold_status'
          financial_account_token:
            type: string
            format: uuid
          pending_amount:
            type: integer
            description: Current pending amount (0 when resolved)
          currency:
            type: string
          events:
            type: array
            items:
              $ref: '#/components/schemas/hold_event'
          user_defined_id:
            type:
            - string
            - 'null'
          expiration_datetime:
            type:
            - string
            - 'null'
            format: date-time
            description: When the hold will auto-expire if not resolved
      required:
      - family
      - result
      - status
      - financial_account_token
      - pending_amount
      - currency
      - events
      - user_defined_id
      - expiration_datetime
    financial-account-transaction:
      properties:
        category:
          description: 'Status types:


            * `CARD` - Issuing card transaction.

            * `ACH` - Transaction over ACH.

            * `INTERNAL` - Transaction for internal adjustment.

            * `TRANSFER` - Internal transfer of funds between financial accounts in your program.

            '
          enum:
          - ACH
          - CARD
          - INTERNAL
          - TRANSFER
          type: string
        created:
          description: Date and time when the financial transaction first occurred. UTC time zone.
          format: date-time
          type: string
        currency:
          description: 3-character alphabetic ISO 4217 code for the settling currency of the transaction.
          type: string
        descriptor:
          description: A string that provides a description of the financial transaction; may be useful to display to users.
          type: string
        events:
          description: A list of all financial events that have modified this financial transaction.
          items:
            $ref: '#/components/schemas/financial_event'
          type: array
        pending_amount:
          description: 'Pending amount of the transaction in the currency''s smallest unit (e.g., cents), including any acquirer fees.


            The value of this field will go to zero over time once the financial transaction is settled.

            '
          type: integer
        result:
          description: APPROVED transactions were successful while DECLINED transactions were declined by user, Lithic, or the network.
          enum:
          - APPROVED
          - DECLINED
          type: string
        settled_amount:
          description: Amount of the transaction that has been settled in the currency's smallest unit (e.g., cents), including any acquirer fees. This may change over time.
          type: integer
        status:
          description: 'Status types:


            * `DECLINED` - The transaction was declined.

            * `EXPIRED` - The authorization as it has passed its expiration time. Card transaction only.

            * `PENDING` - The transaction is expected to settle.

            * `RETURNED` - The transaction has been returned.

            * `SETTLED` - The transaction is completed.

            * `VOIDED` - The transaction was voided. Card transaction only.

            '
          enum:
          - DECLINED
          - EXPIRED
          - PENDING
          - RETURNED
          - SETTLED
          - VOIDED
          type: string
        token:
          description: Globally unique identifier.
          format: uuid
          type: string
        updated:
          description: Date and time when the financial transaction was last updated. UTC time zone.
          format: date-time
          type: string
      required:
      - category
      - created
      - currency
      - descriptor
      - events
      - pending_amount
      - result
      - settled_amount
      - status
      - token
      - updated
      type: object
