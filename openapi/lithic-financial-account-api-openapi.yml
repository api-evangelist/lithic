    base-transaction-response:
      title: Transaction Response
      description: 'Response containing multiple transaction types. The `family` field determines which transaction type is returned: INTERNAL returns FinancialTransaction, TRANSFER returns BookTransferTransaction, CARD returns CardTransaction, PAYMENT returns PaymentTransaction, EXTERNAL_PAYMENT returns ExternalPaymentResponse, MANAGEMENT_OPERATION returns ManagementOperationTransaction, and HOLD returns HoldTransaction'
      discriminator:
        propertyName: family
        mapping:
          INTERNAL: '#/components/schemas/financial-transaction'
          TRANSFER: '#/components/schemas/book-transfer-transaction'
          CARD: '#/components/schemas/card-transaction'
          PAYMENT: '#/components/schemas/payment-transaction'
          EXTERNAL_PAYMENT: '#/components/schemas/external_payment_response'
          MANAGEMENT_OPERATION: '#/components/schemas/management_operation_transaction'
          HOLD: '#/components/schemas/hold_transaction'
      oneOf:
      - $ref: '#/components/schemas/financial-transaction'
      - $ref: '#/components/schemas/book-transfer-transaction'
      - $ref: '#/components/schemas/card-transaction'
      - $ref: '#/components/schemas/payment-transaction'
      - $ref: '#/components/schemas/external_payment_response'
      - $ref: '#/components/schemas/management_operation_transaction'
      - $ref: '#/components/schemas/hold_transaction'
    detailed_results:
      title: Detailed Results
      type: string
      enum:
      - APPROVED
      - INSUFFICIENT_FUNDS
    financial_event:
      title: Financial Event
      description: Financial Event
      type: object
      properties:
        amount:
          description: Amount of the financial event that has been settled in the currency's smallest unit (e.g., cents).
          type: integer
        created:
          description: Date and time when the financial event occurred. UTC time zone.
          type: string
          format: date-time
        result:
          description: APPROVED financial events were successful while DECLINED financial events were declined by user, Lithic, or the network.
          type: string
          enum:
          - APPROVED
          - DECLINED
        token:
          description: Globally unique identifier.
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/financial_event_type'
    pos_terminal:
      title: Point of Sale Terminal
      type: object
      properties:
        attended:
          description: True if a clerk is present at the sale.
          type: boolean
        card_retention_capable:
          description: True if the terminal is capable of retaining the card.
          type: boolean
        on_premise:
          description: True if the sale was made at the place of business (vs. mobile).
          type: boolean
        operator:
          description: The person that is designated to swipe the card
          enum:
          - ADMINISTRATIVE
          - CARDHOLDER
          - CARD_ACCEPTOR
          - UNKNOWN
          type: string
        partial_approval_capable:
          type: boolean
          description: 'True if the terminal is capable of partial approval. Partial approval is when part of a transaction is approved and another payment must be used for the remainder. Example scenario: A $40 transaction is attempted on a prepaid card with a $25 balance. If partial approval is enabled, $25 can be authorized, at which point the POS will prompt the user for an additional payment of $15.'
        pin_capability:
          description: Status of whether the POS is able to accept PINs
          enum:
          - CAPABLE
          - INOPERATIVE
          - NOT_CAPABLE
          - UNSPECIFIED
          type: string
        acceptor_terminal_id:
          description: Uniquely identifies a terminal at the card acceptor location of acquiring institutions or merchant POS Systems
          type:
          - string
          - 'null'
        type:
          description: POS Type
          enum:
          - ADMINISTRATIVE
          - ATM
          - AUTHORIZATION
          - COUPON_MACHINE
          - DIAL_TERMINAL
          - ECOMMERCE
          - ECR
          - FUEL_MACHINE
          - HOME_TERMINAL
          - MICR
          - OFF_PREMISE
          - PAYMENT
          - PDA
          - PHONE
          - POINT
          - POS_TERMINAL
          - PUBLIC_UTILITY
          - SELF_SERVICE
          - TELEVISION
          - TELLER
          - TRAVELERS_CHECK_MACHINE
          - VENDING
          - VOICE
          - UNKNOWN
          type: string
      required:
      - attended
      - card_retention_capable
      - on_premise
      - operator
      - partial_approval_capable
      - pin_capability
      - type
    transaction_amounts:
      title: Transaction Amounts
      type: object
      properties:
        cardholder:
          properties:
            amount:
              description: The estimated settled amount of the transaction in the cardholder billing currency.
              type: integer
              example: -1000
            conversion_rate:
              description: The exchange rate used to convert the merchant amount to the cardholder billing amount.
              type: string
              example: '1.000000'
            currency:
              $ref: '#/components/schemas/currency'
          type: object
          required:
          - amount
          - conversion_rate
          - currency
        hold:
          properties:
            amount:
              description: The pending amount of the transaction in the anticipated settlement currency.
              type: integer
              example: 0
            currency:
              $ref: '#/components/schemas/currency'
          type: object
          required:
          - amount
          - currency
        merchant:
          properties:
            amount:
              description: The settled amount of the transaction in the merchant currency.
              type: integer
              example: -1000
            currency:
              $ref: '#/components/schemas/currency'
          type: object
          required:
          - amount
          - currency
        settlement:
          properties:
            amount:
              description: The settled amount of the transaction in the settlement currency.
              type: integer
              example: -1000
            currency:
              $ref: '#/components/schemas/currency'
          type: object
          required:
          - amount
          - currency
      required:
      - cardholder
      - hold
      - merchant
      - settlement
    visa_network_specific_data:
