          - DEFERRED_BILLING
          - ELECTRONIC_ORDER
          - INSTALLMENT
          - MAIL_ORDER
          - NOT_PRESENT
          - PREAUTHORIZED
          - PRESENT
          - REOCCURRING
          - TELEPHONE_ORDER
          - UNKNOWN
