        pan:
          type: string
          enum:
          - AUTO_ENTRY
          - BAR_CODE
          - CONTACTLESS
          - CREDENTIAL_ON_FILE
          - ECOMMERCE
          - ERROR_KEYED
          - ERROR_MAGNETIC_STRIPE
          - ICC
          - KEY_ENTERED
          - MAGNETIC_STRIPE
          - MANUAL
          - OCR
          - SECURE_CARDLESS
          - UNKNOWN
