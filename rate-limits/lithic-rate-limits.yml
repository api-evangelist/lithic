specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Lithic
providerId: lithic
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- FinTech
- BaaS
- Card Issuing
- Payments
- Embedded Finance
- Rate Limiting
description: Lithic enforces per-program rate limits on the REST API.
notes: ASA timeouts are short (~2 seconds).
sources:
- https://docs.lithic.com/docs/api-keys-and-rate-limits
responseCodes:
  throttled: 429
limits:
- name: Default API RPS
  scope: program
  metric: requests_per_second
  limit: 50
  notes: Default per-program throughput.
- name: ASA Timeout
  scope: program
  metric: milliseconds
  limit: 2000
  notes: Auth Stream Access hard timeout.
policies:
- name: Backoff Strategy
  description: Exponential backoff on 429.
- name: Idempotency
  description: Use idempotency keys on POST endpoints.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
